name: Deploy Worker

# Keeps the live Cloudflare Worker and D1 schema in step with main.
# Needs the CLOUDFLARE_API_TOKEN Actions secret (Workers Scripts: Edit, D1: Edit);
# until it exists the job skips with a warning rather than failing.

on:
  push:
    branches: [main]
    paths: ['worker/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set — Worker NOT deployed. Deploy manually: cd worker && npx wrangler deploy"
            echo "present=false" >> $GITHUB_OUTPUT
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - name: Unit tests
        if: steps.token.outputs.present == 'true'
        run: npm test

      - name: Apply D1 migrations
        if: steps.token.outputs.present == 'true'
        run: npx --yes wrangler@4 d1 migrations apply marine-weather-log --remote

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx --yes wrangler@4 deploy
